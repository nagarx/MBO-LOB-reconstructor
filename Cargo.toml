[package]
name = "mbo-lob-reconstructor"
version = "1.0.0"
build = "build.rs"
edition = "2021"
rust-version = "1.88"
authors = ["nagarx"]
description = "Source-bound MBO decoding and exact XNAS LOB reconstruction"
documentation = "https://docs.rs/mbo-lob-reconstructor"
repository = "https://github.com/nagarx/MBO-LOB-reconstructor"
homepage = "https://github.com/nagarx/MBO-LOB-reconstructor"
license = "LicenseRef-Proprietary"
readme = "README.md"
keywords = ["lob", "orderbook", "mbo", "hft", "machine-learning"]
categories = ["finance", "data-structures", "science"]
exclude = ["data/"]

[workspace]
members = [".", "crates/hft-mbo-event-contract"]
resolver = "2"

[lib]
name = "mbo_lob_reconstructor"
path = "src/lib.rs"

[features]
default = ["databento"]
databento = ["dep:dbn", "dep:sha2", "dep:time"]

[dependencies]
hft-mbo-event-contract = { path = "crates/hft-mbo-event-contract", version = "0.1.0" }
# DBN decoding (optional, enabled by default)
#
# Pin bumped v0.20.0 -> v0.64.0 on 2026-08-01. Justification is empirical, not
# aspirational: a two-arm differential harness (`scripts/ci/dbn_version_diff/`,
# monorepo root) decoded the SAME bytes under BOTH crate versions and compared
# raw per-record FNV-1a-64 digests. Across 296,675,250 records spanning every
# schema this pipeline reads — 55,997,458 of them XNAS.ITCH MBO over 5 full days
# — the two decoders produced a BYTE-IDENTICAL record stream, with zero decode
# errors, zero skipped records and zero unmapped rtypes on either arm.
# `MboMsg` field names, types and `offset_of` are identical across all 57 tags.
# Full evidence: `.session_state/2026-08-01-blast-radius/DBN_VERSION_DIFF.md`.
#
# READ THIS BEFORE TOUCHING THE DECODER CONSTRUCTION AT `src/loader/canonical.rs`:
# dbn 0.35.0 (2025-05-28) "Changed the default `VersionUpgradePolicy` to
# `UpgradeToV3`"; 0.25.0 (2024-12-17) had already renamed the `Upgrade` variant
# to `UpgradeToV2`. v0.20.0's default was `Upgrade` (i.e. to v2). NEITHER default
# is `AsIs`, and `AsIs` is what produced every number on disk. We are safe only
# because `DynDecoder::inferred_with_buffer` takes the policy as a REQUIRED
# positional argument in both versions and we pass `AsIs` explicitly. Any future
# migration to a constructor that DEFAULTS the policy would silently switch us to
# `UpgradeToV3`. Keep it explicit. See the comment at that call site.
dbn = { git = "https://github.com/databento/dbn.git", tag = "v0.64.0", optional = true }
sha2 = { version = "0.10", optional = true }
rustix = { version = "1.1.4", features = ["fs"] }
time = { version = "0.3.54", optional = true }

# Core data structures
ahash = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"

# Phase M M.A.5: atomic write for `_reconstruction_stats.json`. SSoT-deferred:
# `hft_statistics::io::atomic_write_json` (default-off `io` feature, 0.3.0-dev)
# is the canonical primitive; consolidation is scheduled for a sibling-wide
# 0.3.x bump cycle when reconstructor + sibling profilers all migrate together.
tempfile = "3.8"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
sha2 = "0.10"

[[bench]]
name = "reconstruction"
harness = false

[[bin]]
name = "xnas_replay_probe"
path = "src/bin/xnas_replay_probe.rs"
required-features = ["databento"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
