[package]
name = "hft-mbo-event-contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "LicenseRef-Proprietary"
description = "Lossless canonical MBO event types and typed disposition boundary"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
